name: Deploy K-Ramen Dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'k-ramen-dashboard/**'
      - 'leader-signal-radar/**'
      - '.github/workflows/deploy-k-ramen-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore and verify latest dashboard HTML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import re

          path = Path('k-ramen-dashboard/index.html')
          wrapper = path.read_text(encoding='utf-8')
          match = re.search(r"const b='([^']+)'", wrapper)
          if not match:
              raise SystemExit('Embedded dashboard payload was not found.')

          html = gzip.decompress(base64.b64decode(match.group(1)))
          digest = hashlib.sha256(html).hexdigest()
          expected = '802ce69b6b7fed63980549db2cdd0f279eb8c2c019545ce57eddeba7efbe13b8'
          if digest != expected:
              raise SystemExit(f'Dashboard checksum mismatch: {digest}')

          path.write_bytes(html)
          PY
          grep -q 'K-라면 수출 대시보드' k-ramen-dashboard/index.html
          grep -q '2026.08' k-ramen-dashboard/index.html
          grep -q 'period:"full"' k-ramen-dashboard/index.html
          grep -q 'releaseDate:"2026-09-01"' k-ramen-dashboard/index.html
          grep -q 'total:156.627873' k-ramen-dashboard/index.html
          grep -q '2025 Q2 vs 2026 Q2' k-ramen-dashboard/index.html
          grep -q '진행 중 분기 추정' k-ramen-dashboard/index.html
          grep -q 'buildCurrentQuarterEstimate' k-ramen-dashboard/index.html
          touch .nojekyll


      - name: Validate Leader Signal Radar data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          import json
          import re

          path = Path('leader-signal-radar/data/daily.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          required_top = {
              'schemaVersion', 'asOfDate', 'updatedAt', 'status', 'statusMessage',
              'currentSignalIds', 'currentObservationIds', 'dailyThesis',
              'lastSuccessfulRun', 'researchWindow', 'runSummary', 'signals',
              'observations', 'themes', 'checkpoints'
          }
          if not required_top.issubset(data):
              raise SystemExit('Leader signal data is missing required fields.')
          if data['schemaVersion'] != 2:
              raise SystemExit('Unsupported Leader signal schema version.')
          if not re.fullmatch(r'\d{4}\.\d{2}\.\d{2}', data['asOfDate']):
              raise SystemExit('Invalid Leader signal asOfDate.')
          datetime.fromisoformat(data['updatedAt'])
          if data['status'] not in {'pending', 'signals', 'observations', 'no_signal', 'partial'}:
              raise SystemExit('Invalid Leader signal status.')

          signals = data['signals']
          observations = data['observations']
          signal_ids = [signal.get('id') for signal in signals]
          observation_ids = [signal.get('id') for signal in observations]
          current_ids = data['currentSignalIds']
          current_observation_ids = data['currentObservationIds']
          all_ids = signal_ids + observation_ids
          if len(all_ids) != len(set(all_ids)):
              raise SystemExit('Duplicate Leader signal IDs across tiers.')
          if len(current_ids) != len(set(current_ids)) or len(current_observation_ids) != len(set(current_observation_ids)):
              raise SystemExit('Duplicate current Leader signal IDs.')
          if not set(current_ids).issubset(set(signal_ids)):
              raise SystemExit('Current decisive signal IDs are not present in decisive history.')
          if not set(current_observation_ids).issubset(set(observation_ids)):
              raise SystemExit('Current observation IDs are not present in observation history.')
          if data['status'] == 'signals' and not current_ids:
              raise SystemExit('Signals status requires currentSignalIds.')
          if data['status'] == 'observations' and (current_ids or not current_observation_ids):
              raise SystemExit('Observations status requires observation IDs and no decisive IDs.')
          if data['status'] == 'no_signal' and (current_ids or current_observation_ids):
              raise SystemExit('No-signal status cannot have current IDs.')

          required_signal = {
              'id', 'leader', 'role', 'initials', 'score', 'kind', 'date',
              'reportDate', 'theme', 'headline', 'takeaway', 'before', 'now',
              'facts', 'action', 'impact', 'impactPath', 'counter', 'next',
              'source', 'sourceLabel', 'sourceGrade'
          }
          for tier_name, tier_signals in (('decisive', signals), ('observation', observations)):
              for signal in tier_signals:
                  if not required_signal.issubset(signal):
                      raise SystemExit(f"Signal {signal.get('id')} is incomplete.")
                  if not 0 <= signal['score'] <= 100:
                      raise SystemExit(f"Signal {signal['id']} has an invalid score.")
                  if tier_name == 'decisive' and signal['score'] < 75:
                      raise SystemExit(f"Decisive signal {signal['id']} is below 75.")
                  if tier_name == 'observation' and not 60 <= signal['score'] < 75:
                      raise SystemExit(f"Observation signal {signal['id']} is outside 60-74.")
                  if signal['sourceGrade'] not in {'A', 'B'}:
                      raise SystemExit(f"Signal {signal['id']} has an invalid source grade.")
                  if not signal['source'].startswith('https://'):
                      raise SystemExit(f"Signal {signal['id']} has an invalid source URL.")
                  if not signal['facts'] or len(signal['impactPath']) < 2:
                      raise SystemExit(f"Signal {signal['id']} lacks evidence or impact steps.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
