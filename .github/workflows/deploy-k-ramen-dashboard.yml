name: Deploy K-Ramen Dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'k-ramen-dashboard/**'
      - '.github/workflows/deploy-k-ramen-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify latest K-Ramen dashboard file
        shell: bash
        run: |
          set -euo pipefail
          test -s k-ramen-dashboard/index.html
          grep -q 'K-라면 수출 대시보드' k-ramen-dashboard/index.html
          touch .nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
