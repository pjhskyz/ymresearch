name: Deploy YM Research Website

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - '51e4c16e02c84c28b2f495f79552cd33.txt'
      - 'homepage/**'
      - 'k-ramen-dashboard/**'
      - 'leader-signal-radar/**'
      - '.github/workflows/deploy-k-ramen-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore and verify latest dashboard HTML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import re

          path = Path('k-ramen-dashboard/index.html')
          wrapper = path.read_text(encoding='utf-8')
          match = re.search(r"const b='([^']+)'", wrapper)
          if not match:
              raise SystemExit('Embedded dashboard payload was not found.')

          html = gzip.decompress(base64.b64decode(match.group(1)))
          digest = hashlib.sha256(html).hexdigest()
          expected = 'a3b2ca638d2d3763dd2ad8333d2c4d55c2236490bd6c72e5b17b8d709c3ab3c0'
          if digest != expected:
              raise SystemExit(f'Dashboard checksum mismatch: {digest}')

          path.write_bytes(html)
          PY
          grep -q 'K-라면 수출 대시보드' k-ramen-dashboard/index.html
          grep -q '2026.11' k-ramen-dashboard/index.html
          grep -q 'period:"1-10"' k-ramen-dashboard/index.html
          grep -q 'releaseDate:"2026-11-11"' k-ramen-dashboard/index.html
          grep -q 'total:50.158680' k-ramen-dashboard/index.html
          grep -q 'm:"2026.08",total:156.623983' k-ramen-dashboard/index.html
          grep -q 'kg:37311905.90,krw:223264563685,countryCount:106,status:"final",period:"full",asOf:"2026-08-31",releaseDate:"2026-09-15"' k-ramen-dashboard/index.html
          grep -q '최근 확정치' k-ramen-dashboard/index.html
          grep -q '2025 Q2 vs 2026 Q2' k-ramen-dashboard/index.html
          grep -q '진행 중 분기 추정' k-ramen-dashboard/index.html
          grep -q 'buildCurrentQuarterEstimate' k-ramen-dashboard/index.html
          node - <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('k-ramen-dashboard/index.html', 'utf8');
          const start = html.indexOf('const YEARLY=');
          const end = html.indexOf('// KPI', start);
          assert(start >= 0 && end > start, 'Dashboard data and calculation block was not found.');
          const { M, Q, QE, mOM, gY } = vm.runInNewContext(html.slice(start, end) + ';({M,Q,QE,mOM,gY})');
          const latest = M[M.length - 1];
          assert.equal(latest.m, '2026.11');
          assert.equal(latest.period, '1-10');
          assert.equal(latest.asOf, '2026-11-10');
          assert.equal(latest.releaseDate, '2026-11-11');
          assert.equal(latest.total, 50.158680);
          assert.equal(latest.kg, 11991543.79);
          assert.equal(latest.krw, 66855343845);
          assert.equal(latest.countryCount, 150);
          assert.equal(latest.activeCountryCount, 76);
          assert.equal(latest.status, 'provisional');
          assert.equal(latest.prevMonthSamePeriod.period, '1-10');
          assert.equal(latest.prevMonthSamePeriod.total, 44.160390);
          assert.equal(latest.prevMonthSamePeriod.kg, 10504843.23);
          assert.equal(mOM(latest, 'total'), 13.6);
          assert.equal(gY(latest, 'total'), null);
          assert(html.includes("'동기간 MoM '"));
          const oct = M.find(r => r.m === '2026.10');
          assert.equal(oct.total, 172.979123);
          assert.equal(oct.status, 'provisional');
          assert.equal(oct.period, 'full');
          assert(QE && QE.label === '2026 Q4' && QE.partialIncluded && QE.completedMonths === 1 && QE.months === 2);
          assert(Math.abs(QE.total - (oct.total + latest.total / 10 * 30) / 2 * 3) < 1e-8);
          assert(Math.abs(QE.kg - (oct.kg + latest.kg / 10 * 30) / 2 * 3) < 1e-6);
          assert.equal(QE.observedTotal, oct.total + latest.total);
          assert.equal(QE.basis, '(10월 월 전체 실적 + 11월 1~10일 실적 ÷ 10일 × 30일) ÷ 2 × 3');
          const sep = M.find(r => r.m === '2026.09');
          assert.equal(sep.status, 'final');
          assert.equal(sep.period, 'full');
          assert.equal(sep.releaseDate, '2026-10-15');
          assert.equal(sep.total, 169.267595);
          assert.equal(sep.krw, 230895793505);
          assert.equal(sep.kg, 40107034.01);
          const q3 = Q.find(q => q.label === '2026 Q3');
          assert(q3 && !q3.provisional && q3.months === 3);
          assert(Math.abs(q3.total - (151.080944 + 156.623983 + sep.total)) < 1e-8);
          const [year, month] = latest.m.split('.').map(Number);
          const quarter = Math.ceil(month / 3);
          const label = year + ' Q' + quarter;
          const rows = M.filter(r => Number(r.m.slice(0, 4)) === year && Math.ceil(Number(r.m.slice(5)) / 3) === quarter);
          const complete = rows.length === 3 && rows.every(r => r.period === 'full');
          if (complete) {
            assert.equal(QE, null, 'A completed quarter must not retain an estimate.');
            const actual = Q.find(q => q.label === label);
            assert(actual && actual.months === 3, 'Completed quarter is missing from monthly aggregates.');
            for (const field of ['total', 'kg']) {
              const expected = rows.reduce((sum, r) => sum + r[field], 0);
              assert(Math.abs(actual[field] - expected) < 1e-6, 'Quarter aggregate mismatch: ' + field);
            }
            assert.equal(actual.provisional, rows.some(r => r.status === 'provisional'), 'Quarter provisional badge is incorrect.');
          } else {
            assert(QE && QE.label === label && QE.estimate, 'An incomplete quarter requires a separate estimate.');
            assert(!Q.some(q => q.label === label), 'An incomplete quarter must not enter actual aggregates.');
          }
          JS
          touch .nojekyll


      - name: Validate Leader Signal Radar data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          import json
          import re

          path = Path('leader-signal-radar/data/daily.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          required_top = {
              'schemaVersion', 'asOfDate', 'updatedAt', 'status', 'statusMessage',
              'currentSignalIds', 'currentObservationIds', 'dailyThesis',
              'lastSuccessfulRun', 'researchWindow', 'runSummary', 'signals',
              'observations', 'themes', 'checkpoints'
          }
          if not required_top.issubset(data):
              raise SystemExit('Leader signal data is missing required fields.')
          if data['schemaVersion'] != 2:
              raise SystemExit('Unsupported Leader signal schema version.')
          if not re.fullmatch(r'\d{4}\.\d{2}\.\d{2}', data['asOfDate']):
              raise SystemExit('Invalid Leader signal asOfDate.')
          datetime.fromisoformat(data['updatedAt'])
          if data['status'] not in {'pending', 'signals', 'observations', 'no_signal', 'partial'}:
              raise SystemExit('Invalid Leader signal status.')

          signals = data['signals']
          observations = data['observations']
          signal_ids = [signal.get('id') for signal in signals]
          observation_ids = [signal.get('id') for signal in observations]
          current_ids = data['currentSignalIds']
          current_observation_ids = data['currentObservationIds']
          all_ids = signal_ids + observation_ids
          if len(all_ids) != len(set(all_ids)):
              raise SystemExit('Duplicate Leader signal IDs across tiers.')
          if len(current_ids) != len(set(current_ids)) or len(current_observation_ids) != len(set(current_observation_ids)):
              raise SystemExit('Duplicate current Leader signal IDs.')
          if not set(current_ids).issubset(set(signal_ids)):
              raise SystemExit('Current decisive signal IDs are not present in decisive history.')
          if not set(current_observation_ids).issubset(set(observation_ids)):
              raise SystemExit('Current observation IDs are not present in observation history.')
          if data['status'] == 'signals' and not current_ids:
              raise SystemExit('Signals status requires currentSignalIds.')
          if data['status'] == 'observations' and (current_ids or not current_observation_ids):
              raise SystemExit('Observations status requires observation IDs and no decisive IDs.')
          if data['status'] == 'no_signal' and (current_ids or current_observation_ids):
              raise SystemExit('No-signal status cannot have current IDs.')

          required_signal = {
              'id', 'leader', 'role', 'initials', 'score', 'kind', 'date',
              'reportDate', 'theme', 'headline', 'takeaway', 'before', 'now',
              'facts', 'action', 'impact', 'impactPath', 'counter', 'next',
              'source', 'sourceLabel', 'sourceGrade'
          }
          for tier_name, tier_signals in (('decisive', signals), ('observation', observations)):
              for signal in tier_signals:
                  if not required_signal.issubset(signal):
                      raise SystemExit(f"Signal {signal.get('id')} is incomplete.")
                  if not 0 <= signal['score'] <= 100:
                      raise SystemExit(f"Signal {signal['id']} has an invalid score.")
                  if tier_name == 'decisive' and signal['score'] < 75:
                      raise SystemExit(f"Decisive signal {signal['id']} is below 75.")
                  if tier_name == 'observation' and not 60 <= signal['score'] < 75:
                      raise SystemExit(f"Observation signal {signal['id']} is outside 60-74.")
                  if signal['sourceGrade'] not in {'A', 'B'}:
                      raise SystemExit(f"Signal {signal['id']} has an invalid source grade.")
                  if not signal['source'].startswith('https://'):
                      raise SystemExit(f"Signal {signal['id']} has an invalid source URL.")
                  if not signal['facts'] or len(signal['impactPath']) < 2:
                      raise SystemExit(f"Signal {signal['id']} lacks evidence or impact steps.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4







